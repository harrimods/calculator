<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Math Solver Pro · HarriMods</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      background: #fafafa;
      color: #18181b;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    img, svg { max-width: 100%; display: block; }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="minimal-white">
  <div class="solver-card">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">∑</div>
        <div class="brand-text">
          <h1>Math Solver Pro</h1>
          <p class="brand-credit">by <strong>HarriMods</strong> <span class="credit-tag">junior cld dev</span></p>
        </div>
      </div>

      <div class="theme-selector" id="themeSelector">
        <button class="theme-trigger" id="themeTrigger" aria-haspopup="true" aria-expanded="false">
          <span class="theme-trigger-icon">◐</span>
          <span class="theme-trigger-label" id="themeLabel">Minimal White</span>
          <span class="theme-trigger-caret">▾</span>
        </button>

        <div class="theme-menu" id="themeMenu" role="menu">
          <div class="theme-menu-header">Appearance</div>

          <div class="theme-group">
            <div class="theme-group-label">Light</div>
            <button class="theme-option" data-theme="minimal-white" role="menuitem">
              <span class="theme-swatch swatch-mw"></span>
              <span class="theme-option-text">
                <span class="theme-option-name">Minimal White</span>
                <span class="theme-option-desc">Clean, borderless, distraction-free</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="stylish-white" role="menuitem">
              <span class="theme-swatch swatch-sw"></span>
              <span class="theme-option-text">
                <span class="theme-option-name">Stylish White</span>
                <span class="theme-option-desc">Animated, polished, expressive</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
          </div>

          <div class="theme-group">
            <div class="theme-group-label">Dark</div>
            <button class="theme-option" data-theme="minimal-black" role="menuitem">
              <span class="theme-swatch swatch-mb"></span>
              <span class="theme-option-text">
                <span class="theme-option-name">Minimal Black</span>
                <span class="theme-option-desc">Pure dark, flat and focused</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
            <button class="theme-option" data-theme="stylish-black" role="menuitem">
              <span class="theme-swatch swatch-sb"></span>
              <span class="theme-option-text">
                <span class="theme-option-name">Stylish Black</span>
                <span class="theme-option-desc">Neon-accented, animated dark mode</span>
              </span>
              <span class="theme-check">✓</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="subhead">
      Arithmetic · Linear · Quadratic · Powers · SOHCAHTOA · Step-by-step
    </div>

    <div class="input-area">
      <div class="input-group">
        <input type="text" id="mathInput" placeholder="e.g. 12+8*3  |  2x+5=15  |  x^2-4x+3=0  |  sin(30)  |  2^10" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
      </div>
      <div class="action-row">
        <button class="solve-btn" id="solveBtn">
          <span class="solve-icon">⚡</span> Solve &amp; Explain
        </button>
        <div class="examples">
          <button class="example-btn" data-ex="12 + 8 * 3 - 6 / 2">12+8*3-6/2</button>
          <button class="example-btn" data-ex="2x + 7 = 19">2x+7=19</button>
          <button class="example-btn" data-ex="x^2 - 5x + 6 = 0">x²-5x+6=0</button>
          <button class="example-btn" data-ex="2^10">2^10</button>
          <button class="example-btn" data-ex="sin(30) + cos(60)">sin(30)+cos(60)</button>
          <button class="example-btn" data-ex="3(x-2)=12">3(x-2)=12</button>
        </div>
      </div>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-label">
        <span>📌 Result &amp; Explanation</span>
        <span class="badge" id="detectionBadge">waiting</span>
      </div>
      <div class="result-content" id="resultContent">
        Enter an expression or equation…
      </div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <span>🕘 History</span>
        <button class="clear-history-btn" id="clearHistoryBtn">Clear</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <footer class="footnote">
      <span>+ − × ÷ ^ ( )</span>
      <span>sin cos tan (degrees)</span>
      <span>linear &amp; quadratic</span>
      <span>step-by-step</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
